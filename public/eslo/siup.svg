<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <rect width="400" height="550" fill="#fcfcfc" />
  
  <!-- Outer Border with Pattern -->
  <rect x="15" y="15" width="370" height="520" fill="none" stroke="#2980b9" stroke-width="4" stroke-dasharray="10, 5" />
  <rect x="20" y="20" width="360" height="510" fill="none" stroke="#2c3e50" stroke-width="1" />
  
  <!-- Logo Placeholder -->
  <circle cx="200" cy="80" r="30" fill="#3498db" />
  <path d="M190 85 L210 85 L200 60 Z" fill="#fff" />
  
  <!-- Header -->
  <text x="200" y="140" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">KEMENTERIAN KELAUTAN DAN PERIKANAN</text>
  <text x="200" y="160" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">REPUBLIK INDONESIA</text>
  
  <!-- Title -->
  <text x="200" y="200" font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">SURAT IZIN USAHA PERIKANAN (SIUP)</text>
  <text x="200" y="220" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">NOMOR: 123/SIUP/KKP/2026</text>
  
  <line x1="80" y1="230" x2="320" y2="230" stroke="#000" stroke-width="1" />
  
  <!-- Body text -->
  <text x="40" y="260" font-family="Arial, sans-serif" font-size="11" fill="#333">Diberikan kepada:</text>
  <text x="50" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000">Nama Perusahaan : PT CONTOH NELAYAN MAJU</text>
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="12" fill="#000">NPWP                    : 01.234.567.8-901.000</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="12" fill="#000">Alamat                  : Jl. Pelabuhan Perikanan No 1</text>
  
  <!-- Stamp and Signature -->
  <circle cx="280" cy="430" r="40" fill="none" stroke="#8e44ad" stroke-width="3" opacity="0.6"/>
  <circle cx="280" cy="430" r="35" fill="none" stroke="#8e44ad" stroke-width="1" opacity="0.6"/>
  <text x="280" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad" opacity="0.6" transform="rotate(-15 280 430)">SAH</text>
  
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">DIREKTUR JENDERAL</text>
  <path d="M 250 430 Q 280 400 310 440" fill="none" stroke="#2c3e50" stroke-width="2" />
  <text x="280" y="480" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">(Ir. Nama Pejabat)</text>
