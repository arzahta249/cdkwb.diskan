<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <rect width="400" height="550" fill="#f8f9fa" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="360" height="510" fill="none" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Garuda Placeholder -->
  <circle cx="200" cy="70" r="25" fill="#f1c40f" />
  <path d="M190 70 L210 70 L200 50 Z" fill="#e67e22" />
  
  <!-- Header Text -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">PEMERINTAH REPUBLIK INDONESIA</text>
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">NOMOR INDUK BERUSAHA (NIB)</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#e74c3c">1234 5678 9012 3</text>
  
  <!-- Body Lines -->
  <line x1="40" y1="190" x2="360" y2="190" stroke="#bdc3c7" stroke-width="2" />
  
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">Nama Usaha</text>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">: PT CONTOH NELAYAN MAJU</text>
  
  <text x="40" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">Alamat Usaha</text>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">: Jl. Pelabuhan Perikanan No 1</text>
  
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333">Nama Pemilik</text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333">: BAPAK BUDI</text>
  
  <!-- QR Code Placeholder -->
  <rect x="280" y="420" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2" />
  <rect x="285" y="425" width="20" height="20" fill="#000" />
  <rect x="335" y="425" width="20" height="20" fill="#000" />
  <rect x="285" y="475" width="20" height="20" fill="#000" />
  <rect x="320" y="460" width="35" height="35" fill="#000" />
  
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Dokumen ini diterbitkan oleh Sistem OSS</text>
</svg>
